services:
  - type: web
    name: jarvis-secure-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JARVIS_API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
      - key: WPP_BRIDGE_URL
        sync: false
      - key: WPP_BRIDGE_TOKEN
        sync: false
      - key: WPP_SELF_CHAT_ID
        sync: false
